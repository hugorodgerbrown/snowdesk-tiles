[project]
name = "snowdesk-tiles"
version = "0.1.0"
description = "Build and publish the self-hosted OpenFreeMap basemap for Snowdesk"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
# numpy for classify_terrain.py (SNOW-987): a slope kernel over three billion
# cells is not a job for a Python loop. Pillow for transcode_raster.py, which
# encodes the relief tiles' WebP twins. Everything else stays stdlib.
build = ["numpy", "pillow"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "S", "C4", "SIM", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "D103"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
