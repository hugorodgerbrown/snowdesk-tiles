[tox]
envlist = fmt, lint, type, py312
skipsdist = true

[testenv]
description = run the test suite
deps = pytest
commands = pytest {posargs}

[testenv:fmt]
description = check formatting
deps = ruff
commands = ruff format --check scripts tests

[testenv:lint]
description = lint
deps = ruff
commands = ruff check scripts tests

[testenv:type]
description = type-check
deps = mypy
commands = mypy scripts tests
