[tox]
envlist = fmt, lint, type, secrets, py312
skipsdist = true

[testenv]
description = run the test suite
# numpy for classify_terrain.py and its tests — the build extra in pyproject.
deps =
    numpy
    pytest
commands = pytest {posargs}

[testenv:fmt]
description = check formatting
deps = ruff
commands = ruff format --check scripts tests

[testenv:lint]
description = lint
deps = ruff
commands = ruff check scripts tests

[testenv:type]
description = type-check
# pytest is needed to type-check the tests, not to run them here.
deps =
    mypy
    numpy
    pytest
commands = mypy scripts tests

[testenv:secrets]
description = fail if a tracked .env* file holds a literal value, not an op:// reference
skip_install = true
# Overrides the base env's pytest: this check is pure shell and needs nothing.
deps =
allowlist_externals = {toxinidir}/scripts/check-secret-refs.sh
commands = {toxinidir}/scripts/check-secret-refs.sh
